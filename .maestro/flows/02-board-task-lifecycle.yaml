# Main flow: sign in → create a board → create a task in it → delete the task →
# delete the board. Names carry a timestamp so reruns never collide with leftovers.
appId: com.jhurtadojerves.todoapp
name: Ciclo de vida de tablero y tarea
tags:
  - boards
  - tasks
---
- evalScript: ${output.boardName = 'E2E tablero ' + Date.now()}
- evalScript: ${output.taskTitle = 'E2E tarea ' + Date.now()}

- runFlow: ../subflows/login.yaml

# --- Create the board ---
- tapOn: "Boards"
- extendedWaitUntil:
    visible: "Mis tableros"
    timeout: 10000
- tapOn: "Nuevo"
- tapOn: "Nombre"
- inputText: ${output.boardName}
- tapOn: "Descripción"
- inputText: "Creado por Maestro"
- hideKeyboard
- tapOn: "Crear tablero"
- extendedWaitUntil:
    visible: ${output.boardName}
    timeout: 10000

# --- Create a task inside it ---
- tapOn: ${output.boardName}
- tapOn: "Ver tareas"
- extendedWaitUntil:
    visible: "Todas las tareas de este tablero."
    timeout: 10000
- tapOn: "Nueva"
- tapOn: "Título"
- inputText: ${output.taskTitle}
- hideKeyboard
- tapOn: "Crear tarea"
- extendedWaitUntil:
    visible: ${output.taskTitle}
    timeout: 10000

# --- Open and delete the task ---
- tapOn: ${output.taskTitle}
- scrollUntilVisible:
    element: "Eliminar tarea"
    direction: DOWN
- tapOn: "Eliminar tarea"
- tapOn: "(?i)eliminar"
- extendedWaitUntil:
    visible: "Todas las tareas de este tablero."
    timeout: 10000
- assertNotVisible: ${output.taskTitle}

# --- Clean up: delete the board (session persists across relaunch) ---
- launchApp
- tapOn: "Boards"
- tapOn: ${output.boardName}
- scrollUntilVisible:
    element: "Eliminar tablero"
    direction: DOWN
- tapOn: "Eliminar tablero"
- tapOn: "(?i)eliminar"
- extendedWaitUntil:
    visible: "Mis tableros"
    timeout: 10000
- assertNotVisible: ${output.boardName}
